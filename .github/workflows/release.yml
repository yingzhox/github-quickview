name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      # A tag that disagrees with package.json would publish a zip whose
      # filename and manifest contradict the release it is attached to.
      - name: Verify tag matches package version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${pkg_version}" >&2
            exit 1
          fi
          echo "version=${pkg_version}" >> "$GITHUB_ENV"

      - name: Check syntax and manifest
        run: npm run check

      - name: Run tests
        run: npm test

      # Also re-checks that manifest.json and package.json agree.
      - name: Build extension zip
        run: npm run build

      - name: Extract release notes from CHANGELOG
        run: node scripts/release-notes.mjs "${{ env.version }}" > release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/github-quickview-${{ env.version }}.zip" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag
