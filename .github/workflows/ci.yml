name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The project has no dependencies and no lockfile, so there is
      # nothing to install.
      - name: Check syntax and manifest
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Verify the extension zip builds
        run: npm run build
